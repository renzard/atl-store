name: Build ATL + click

# Tests on every push and pull request. The (slow) ATL + click build runs on main, on tags and by hand.
# A tag like v0.2.0 also publishes the click as a GitHub Release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run the tests
        run: |
          set -e
          for t in tests/test_*.py; do
            echo "== $t"
            python3 "$t"
          done

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: write   # only used to attach the click to a release
    steps:
      - uses: actions/checkout@v4

      # ATL takes about an hour to compile. usr/ is reused while the ATL source, the build scripts and
      # tools/versions.env are unchanged (change versions.env to refresh the dependencies).
      - name: Cache the built ATL (usr/)
        id: atl-cache
        uses: actions/cache@v4
        with:
          path: usr
          key: atl-usr-${{ runner.arch }}-${{ hashFiles('atl/**', 'tools/versions.env', 'tools/*.sh', 'tools/*.py', 'tools/Dockerfile.atl') }}

      - name: Build ATL into usr/ (native arm64, no qemu)
        if: steps.atl-cache.outputs.cache-hit != 'true'
        run: ./tools/build_atl.sh

      - name: Show the exact dependency versions
        run: |
          {
            echo "### ATL build info"
            echo '```'
            cat usr/share/atl-build-info.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload usr/ (patched ATL)
        uses: actions/upload-artifact@v4
        with:
          name: atl-usr
          path: usr/

      - name: Build click package
        run: |
          pip install --user clickable-ut
          export PATH="$HOME/.local/bin:$PATH"
          clickable build --skip-review

      - name: Upload click
        uses: actions/upload-artifact@v4
        with:
          name: droidstore-click
          path: |
            **/*.click
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*.click
          generate_release_notes: true
